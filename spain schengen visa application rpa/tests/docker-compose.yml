# Runs the visa-application RPA and drives it over HTTP with static payloads, then
# checks and renders the generated PDFs. Both services are the same image, so the test
# exercises exactly what deploys.
#
#   docker compose -f tests/docker-compose.yml up --build --abort-on-container-exit
#
# Generated PDFs and the field-33 crops land in tests/output/ for review.

services:
  rpa:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: "8090"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health', timeout=2).status==200 else 1)\""
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  tests:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      rpa:
        condition: service_healthy
    environment:
      RPA_BASE_URL: "http://rpa:8090"
    volumes:
      - ./output:/app/tests/output
    command:
      - sh
      - -c
      - "python tests/verify_field33.py && python tests/verify_application_fields.py && python tests/verify_italy.py"
